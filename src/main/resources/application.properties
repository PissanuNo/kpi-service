spring.application.name=kpi-service
server.port=9016
# Spring security
spring.security.user.name=bktlkpi
spring.security.user.password=${SPRING_SECURITY_PASSWORD}
spring.security.user.role=MYTH

######################################################
# Database-Non-prd
######################################################
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url= jdbc:sqlserver://bktlsqlnonprd01.database.windows.net:1433;encrypt=true;trustServerCertificate=true;databaseName=bktlappdbnonprd01
spring.datasource.username=bktlnonprdadmin
spring.datasource.password=${DB_NONPRD_PASSWORD}
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=kpi
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

######################################################
# Key Vault
######################################################
spring.cloud.azure.keyvault.secret.endpoint=https://bktlnonprdkv01.vault.azure.net/
keyvault.public.key=bktlnonprdpbkey
keyvault.private.key=bktlnonprdpvkey

######################################################
# Client Service
######################################################
account.service=http://localhost:9012
auth.service=http://localhost:9015

######################################################
#Sandmerit Config
######################################################
sandmerit.kpi.url=https://hrms.sandfil.com/sandmeritTH/WebAPI/Integration/SFAPI_Data.svc
signon.sandmerit.path=https://hrms.sandfil.com/sandmeritTH/WebAuthentication/BakerTilly_Authentication.aspx?EmpCode=%s&Token=%s
smr.key=${SANMERIT_KEY}
header.key.source.value=Baker Tilly

######################################################
#Actuator
######################################################
info.app.name=@project.name@
info.app.version=@project.version@
management.endpoints.web.exposure.include=health,info
management.endpoint.info.show-details=always
management.info.env.enabled=true
